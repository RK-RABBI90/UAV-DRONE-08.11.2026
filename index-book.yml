name: Build book search index

on:
  push:
    paths:
      - 'UAV_BOOK.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools (Bangla + English)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng
      - name: Build book.json
        run: python3 build_index.py UAV_BOOK.pdf
      - name: Commit book.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add book.json
          git diff --staged --quiet || (git commit -m "Update book search index" && git push)
